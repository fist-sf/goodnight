<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>晚安，好梦</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0716;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1), t0=performance.now();
let words=[], stars=[], shooters=[], bokeh=[];
const rand=(a,b)=>a+Math.random()*(b-a);

/* 温柔但不肉麻的话 */
const PHRASES=["Good night","Sweet dreams","Take care","Sleep well",
               "Rest well","You did great today","See you tomorrow","Don't stay up late",
               "Stay warm","You are doing fine","Have a nice dream","Good rest",
               "Be happy","I'm here"];
/* 偏女孩子的柔和配色 */
const HUES=[330,345,300,275,320,20,45,205];

function build(){
  words=[];stars=[];shooters=[];bokeh=[];
  const wn=46;                                   /* 够密，才有冲击力 */
  for(let i=0;i<wn;i++){
    const dir=Math.random()<.5?-1:1;
    words.push({txt:PHRASES[i%PHRASES.length],
      x:rand(-W*.3,W*1.3), y:rand(H*.05,H*.95),
      vx:dir*rand(1.4,4.2), vy:rand(-.25,.25),   /* 快！有冲击力 */
      size:rand(13,19), ph:rand(0,6.28), sp:rand(1.2,3.2),
      hue:HUES[i%HUES.length], born:rand(0,.5)});
  }
  const sn=Math.round(W*H/4200);                  /* 星星多 */
  for(let i=0;i<sn;i++){
    stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,1.9),
      vx:rand(-.35,.35), vy:rand(-.25,.25),       /* 星星在动 */
      ph:rand(0,6.28), sp:rand(.6,2.2), born:rand(0,1.6),
      big:Math.random()<.07});
  }
  const bn=8;
  for(let i=0;i<bn;i++) bokeh.push({x:rand(0,W),y:rand(0,H),r:rand(30,120),
    vx:rand(-.3,.3), vy:rand(-.25,.25), hue:HUES[i%HUES.length], a:rand(.05,.13)});
}
function resize(){
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0); build();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));

function drawSky(){
  const g=ctx.createLinearGradient(0,0,W*.4,H);
  g.addColorStop(0,'#1a1030'); g.addColorStop(.5,'#120b24'); g.addColorStop(1,'#07050f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const b of bokeh){                        /* 柔光斑 */
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-b.r)b.x=W+b.r; if(b.x>W+b.r)b.x=-b.r;
    if(b.y<-b.r)b.y=H+b.r; if(b.y>H+b.r)b.y=-b.r;
    const rg=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    rg.addColorStop(0,'hsla('+b.hue+',85%,72%,'+b.a+')');
    rg.addColorStop(1,'hsla('+b.hue+',85%,72%,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  }
}

function frame(now){
  const T=(now-t0)/1000;
  drawSky();

  /* 会动、会闪的星星 */
  for(const s of stars){
    const a=Math.min(1,Math.max(0,(T-s.born)/1.2)); if(a<=0)continue;
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<-5)s.x=W+5; if(s.x>W+5)s.x=-5;
    if(s.y<-5)s.y=H+5; if(s.y>H+5)s.y=-5;
    const tw=.4+.6*Math.abs(Math.sin(T*s.sp+s.ph));
    ctx.globalAlpha=a*tw; ctx.fillStyle=s.big?'#fff7e0':'#e8eeff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    if(s.big){
      ctx.globalAlpha=a*tw*.5; ctx.strokeStyle='#fff3d6'; ctx.lineWidth=.9;
      ctx.beginPath();
      ctx.moveTo(s.x-s.r*5,s.y); ctx.lineTo(s.x+s.r*5,s.y);
      ctx.moveTo(s.x,s.y-s.r*5); ctx.lineTo(s.x,s.y+s.r*5);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  /* 流星 */
  if(T>1.2 && shooters.length<3 && Math.random()<.012){
    shooters.push({x:rand(W*.2,W),y:rand(0,H*.35),vx:-rand(6,11),vy:rand(2,4),life:1});
  }
  for(let i=shooters.length-1;i>=0;i--){
    const sh=shooters[i];
    sh.x+=sh.vx; sh.y+=sh.vy; sh.life-=.008;
    ctx.globalAlpha=Math.max(0,sh.life); ctx.strokeStyle='#fff2cf'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-sh.vx*6,sh.y-sh.vy*6); ctx.stroke();
    if(sh.life<=0||sh.x<-200) shooters.splice(i,1);
  }
  ctx.globalAlpha=1;

  /* 快速弹幕（横穿全屏，出屏即回） */
  for(const w of words){
    const a=Math.min(1,Math.max(0,(T-w.born)/.4)); if(a<=0)continue;
    w.x+=w.vx; w.y+=w.vy;
    if(w.x<-200)w.x=W+200; if(w.x>W+200)w.x=-200;
    if(w.y<-40)w.y=H+40;   if(w.y>H+40)w.y=-40;
    const tw=.7+.3*Math.abs(Math.sin(T*w.sp+w.ph));
    ctx.save(); ctx.globalAlpha=a*tw;
    ctx.font='600 '+Math.round(w.size)+'px Georgia,"Times New Roman",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='hsla('+w.hue+',100%,78%,.9)'; ctx.shadowBlur=22;
    ctx.fillStyle='hsla('+w.hue+',95%,88%,1)';
    ctx.fillText(w.txt,w.x,w.y);
    ctx.restore();
  }

    /* 依次出现：L → H → Z → Good Night */
  const SEQ=[{t:0.35,ch:'L'},{t:1.35,ch:'H'},{t:2.35,ch:'Z'},{t:3.55,ch:'Good Night'}];
  for(let i=0;i<SEQ.length;i++){
    const st=SEQ[i].t, en=(i+1<SEQ.length)?SEQ[i+1].t:1e9;
    if(T<st || T>en+0.5) continue;
    const p=Math.min(1,(T-st)/0.7);
    const outP=Math.max(0,Math.min(1,(T-(en-0.12))/0.45));
    const txt=SEQ[i].ch, isWord=txt.length>2;
    const elastic=1+Math.sin(p*Math.PI)*0.2;
    const breathe=1+Math.sin((T-st)*1.7)*0.015;
    let size=260;
    ctx.font='700 '+size+'px Georgia,"Times New Roman",serif';
    size=Math.floor(size*(W*(isWord?0.9:0.34))/Math.max(1,ctx.measureText(txt).width));
    size=Math.min(size,H*(isWord?0.30:0.46));
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.scale(elastic*breathe,elastic*breathe);
    ctx.globalAlpha=Math.min(1,p*1.5)*(1-outP);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='hsla(330,100%,78%,.95)'; ctx.shadowBlur=Math.min(W,H)*0.12;
    const g=ctx.createLinearGradient(0,-size/2,0,size/2);
    g.addColorStop(0,'#fff6fb'); g.addColorStop(0.5,'#ffd9ef'); g.addColorStop(1,'#c9b6ff');
    ctx.fillStyle=g;
    ctx.font='700 '+size+'px Georgia,"Times New Roman",serif';
    ctx.fillText(txt,0,0);
    if(isWord){
      ctx.globalAlpha*=0.82;
      ctx.font=Math.round(size*0.24)+'px Georgia,"Times New Roman",serif';
      ctx.fillText('sweet dreams',0,size*0.78);
    }
    ctx.shadowBlur=0; ctx.restore();
  }
  /* 围绕大字的星尘 */
  if(T>0.5){
    for(let k=0;k<26;k++){
      const ang=k*0.24+T*0.35, rr=Math.min(W,H)*(0.28+((k*37)%50)/160);
      const x=W/2+Math.cos(ang)*rr, y=H/2+Math.sin(ang)*rr*0.55;
      const a=(0.35+0.65*Math.abs(Math.sin(T*2+k)));
      ctx.globalAlpha=a*0.75; ctx.fillStyle='#fff3fb';
      ctx.beginPath(); ctx.arc(x,y,1.6+((k%3)*0.7),0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
function restart(){t0=performance.now();build();}
addEventListener('click',restart);
addEventListener('touchstart',e=>{e.preventDefault();restart();},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();restart();}});
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
